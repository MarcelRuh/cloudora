services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudora}
      POSTGRES_DB: ${POSTGRES_DB:-cloudora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudora} -d ${POSTGRES_DB:-cloudora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudora:
    build: .
    image: cloudora:latest
    container_name: cloudora
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudora}:${POSTGRES_PASSWORD:-cloudora}@postgres:5432/${POSTGRES_DB:-cloudora}?schema=public
      CLOUDORA_STORAGE_PATH: ${CLOUDORA_STORAGE_PATH:-/storage}
      CLOUDORA_HOST_STORAGE: ${CLOUDORA_HOST_STORAGE:-./storage}
      CLOUDORA_USERS_DIR: ${CLOUDORA_USERS_DIR:-users}
      CLOUDORA_SHARED_DIR: ${CLOUDORA_SHARED_DIR:-shared}
      CLOUDORA_INSTALL_DIR: ${CLOUDORA_INSTALL_DIR:-/opt/cloudora}
      CLOUDORA_REPO: ${CLOUDORA_REPO:-MarcelRuh/cloudora}
      CLOUDORA_BRANCH: ${CLOUDORA_BRANCH:-main}
      CLOUDORA_UPDATE_SIGNAL_DIR: /update-signal
      CLOUDORA_HOST_ROOT: /host
      PORT: "3000"
      NODE_ENV: production
      TRUST_PROXY: "true"
    volumes:
      - ${CLOUDORA_HOST_STORAGE:-./storage}:${CLOUDORA_STORAGE_PATH:-/storage}
      - /mnt:/mnt:rslave
      - /media:/media:rslave
      - /srv:/srv:rslave
      - /:/host:ro,rslave
      - cloudora_update_signal:/update-signal
    depends_on:
      postgres:
        condition: service_healthy

  cloudora-updater:
    image: docker:27.5.1-cli
    container_name: cloudora-updater
    restart: unless-stopped
    environment:
      COMPOSE_BAKE: "false"
      CLOUDORA_INSTALL_DIR: ${CLOUDORA_INSTALL_DIR:-/opt/cloudora}
      CLOUDORA_REPO: ${CLOUDORA_REPO:-MarcelRuh/cloudora}
      CLOUDORA_BRANCH: ${CLOUDORA_BRANCH:-main}
      CLOUDORA_UPDATE_SIGNAL_DIR: /update-signal
      CLOUDORA_SIGNAL_VOLUME: cloudora_update_signal
      CLOUDORA_UPDATER_IMAGE: docker:27.5.1-cli
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLOUDORA_INSTALL_DIR:-/opt/cloudora}:${CLOUDORA_INSTALL_DIR:-/opt/cloudora}
      - ${CLOUDORA_INSTALL_DIR:-/opt/cloudora}/scripts/update-watcher.sh:/update-watcher.sh:ro
      - cloudora_update_signal:/update-signal
    entrypoint: ["sh", "/update-watcher.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  cloudora_update_signal:
    name: cloudora_update_signal
